name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: shellcheck
        run: shellcheck -x catalog/scripts/*.sh catalog/scripts/*/*.sh install.sh

  distro-smoke:
    # Dry-run every item and run safe maintenance for real inside each distro.
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "ubuntu:24.04", "debian:13", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      # Base images are minimal: install curl (for rustup) and a C toolchain first.
      - name: Install build deps
        run: |
          if command -v dnf; then dnf install -y curl gcc musl-gcc || dnf install -y curl gcc
          elif command -v apt-get; then apt-get update && apt-get install -y curl ca-certificates gcc musl-tools
          else pacman -Syu --noconfirm curl gcc musl; fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build -p nx-tui --target x86_64-unknown-linux-musl
      - name: Smoke test
        run: |
          B=target/x86_64-unknown-linux-musl/debug/nxtoolkit
          $B info
          $B validate
          ids=$($B list | awk 'NF && $1 !~ /^#/ {print $1}')
          $B apply --dry-run $ids
          $B apply -y git htop journal-vacuum clean-cache

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p nx-tui --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/nxtoolkit nxtoolkit-x86_64-linux-musl
      - uses: softprops/action-gh-release@v2
        with:
          files: nxtoolkit-x86_64-linux-musl
