# Application catalog.
#
# [packages] keys: fedora, debian, arch (native names), aur (Arch, only when
# paru/yay is installed), flatpak (Flathub app id). Each may be a string or a
# list. Install preference: native → aur → flatpak. Distros with no matching
# key don't show the app.

# ── Browsers ────────────────────────────────────────────────────────────────
[[app]]
id = "firefox"
name = "Firefox"
category = "Browsers"
description = "Mozilla's open-source web browser."
packages = { fedora = "firefox", arch = "firefox", flatpak = "org.mozilla.firefox" }

[[app]]
id = "chromium"
name = "Chromium"
category = "Browsers"
description = "Open-source base of Google Chrome."
packages = { fedora = "chromium", arch = "chromium", flatpak = "org.chromium.Chromium" }

[[app]]
id = "brave"
name = "Brave"
category = "Browsers"
description = "Privacy-focused Chromium-based browser."
packages = { aur = "brave-bin", flatpak = "com.brave.Browser" }

[[app]]
id = "librewolf"
name = "LibreWolf"
category = "Browsers"
description = "Firefox fork focused on privacy and security."
packages = { aur = "librewolf-bin", flatpak = "io.gitlab.librewolf-community" }

[[app]]
id = "google-chrome"
name = "Google Chrome"
category = "Browsers"
description = "Google's proprietary web browser."
packages = { aur = "google-chrome", flatpak = "com.google.Chrome" }

